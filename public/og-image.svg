<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <radialGradient id="tealGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>

  <!-- Subtle Modern Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Brand Badge Top Left -->
  <g transform="translate(100, 100)">
    <!-- Logo Icon Box -->
    <rect width="84" height="84" rx="22" fill="url(#brandGrad)" filter="url(#shadow)"/>
    
    <!-- Inner Document Icon -->
    <path d="M 28 20 L 46 20 L 58 32 L 58 64 L 28 64 Z" fill="#ffffff" fill-rule="evenodd"/>
    <path d="M 46 20 L 46 32 L 58 32 Z" fill="#cbd5e1"/>
    <!-- Document Lines -->
    <rect x="34" y="38" width="14" height="3" rx="1.5" fill="#0f172a"/>
    <rect x="34" y="46" width="20" height="3" rx="1.5" fill="#0f172a"/>
    <rect x="34" y="54" width="16" height="3" rx="1.5" fill="#0f172a"/>

    <!-- Brand Name Text -->
    <text x="108" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#f8fafc" letter-spacing="-1">TxtCraft</text>
    <rect x="310" y="26" width="145" height="32" rx="16" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="382" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">100% CLIENT-SIDE</text>
  </g>

  <!-- Hero Headlines -->
  <g transform="translate(100, 250)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
      Free Online <tspan fill="url(#textGrad)">TXT File Maker</tspan>
    </text>

    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
      Create, edit, format, and download plain text (.txt) files in your browser.
    </text>
  </g>

  <!-- Feature Highlights Grid / Pills -->
  <g transform="translate(100, 395)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="52" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="7" fill="#14b8a6"/>
      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">UTF-8, ANSI, UTF-16</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(245, 0)">
      <rect width="230" height="52" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="7" fill="#10b981"/>
      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">CRLF &amp; LF Line Endings</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(490, 0)">
      <rect width="230" height="52" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="7" fill="#38bdf8"/>
      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Batch TXT Generator</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(735, 0)">
      <rect width="230" height="52" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="28" cy="26" r="7" fill="#a855f7"/>
      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">100% Private &amp; Local</text>
    </g>
  </g>

  <!-- Footer Watermark URL -->
  <g transform="translate(100, 535)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600" fill="#475569" letter-spacing="0.5">https://txtcraft.site</text>
  </g>
</svg>